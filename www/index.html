<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b4a">
<meta name="color-scheme" content="light dark">
<title>Verse Puzzle</title>
<style>
/* phone-first single column; cards on warm paper, midnight + gold */
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#1f2433; --muted:#6b6f7c; --line:#e7e0d2;
  --night:#1d2b4a; --gold:#c08a2e; --gold-soft:#f3e6cc; --sage:#5f8a6e; --sage-soft:#e2eee5; --red:#b4483a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:1;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121621; --card:#1b2030; --ink:#ece8de; --muted:#a1a5b2; --line:#2c3245;
  --night:#0d1322; --gold:#d9a648; --gold-soft:#3a3020; --sage:#7fb08f; --sage-soft:#1f3328; --red:#e07a6a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.tile,.kb button,.cc{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:calc(16px*var(--fs))/1.45 var(--sans);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header.top h1{font:600 calc(24px*var(--fs))/1.1 var(--serif);margin:0;letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;padding:0 12px;gap:6px;font-family:var(--sans)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:5px 10px}
.daily{background:var(--night);color:#f6f1e4;border-radius:20px;padding:20px 18px;display:grid;gap:10px;margin-bottom:16px;position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1.5px solid rgba(217,166,72,.35)}
.daily .eyebrow{font-size:calc(12px*var(--fs));letter-spacing:.12em;text-transform:uppercase;color:#d9a648;font-weight:700}
.daily h2{font:600 calc(22px*var(--fs))/1.2 var(--serif);margin:0}
.daily p{margin:0;color:#cfd3dd;font-size:calc(14px*var(--fs))}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 calc(16px*var(--fs))/1 var(--sans);cursor:pointer;min-height:48px}
.btn.gold{background:var(--gold);color:#1b1408}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.night{background:var(--night);color:#fff}
.btn:disabled{opacity:.45}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:grid;gap:6px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--serif)}
.mode b{font:600 calc(17px*var(--fs))/1.2 var(--serif)}
.mode span{font-size:calc(13px*var(--fs));color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--sage);border-radius:3px}
.section-h{font:600 calc(13px*var(--fs))/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
.foot{margin-top:22px;color:var(--muted);font-size:calc(12px*var(--fs));text-align:center}
/* play screens */
.play-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.play-head .t{flex:1;min-width:0}
.play-head .t b{display:block;font:600 calc(18px*var(--fs))/1.2 var(--serif)}
.play-head .t span{font-size:calc(13px*var(--fs));color:var(--muted)}
.ref{font:600 calc(15px*var(--fs)) var(--serif);color:var(--gold);text-align:center;margin:4px 0 12px}
.board{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:120px}
.slots{display:flex;flex-wrap:wrap;gap:6px 6px;min-height:60px;font:calc(19px*var(--fs))/1.5 var(--serif)}
.slot{border-bottom:2px dashed var(--line);min-width:42px;height:1.6em}
.word{padding:2px 2px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 13px;font:calc(17px*var(--fs))/1 var(--serif);cursor:pointer;min-height:44px;box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toolbar{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* cryptogram */
.crypto{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:flex-start}
.cw{display:flex;gap:2px}
.cc{display:grid;grid-template-rows:auto auto;justify-items:center;min-width:calc(22px*var(--fs))}
.cc .l{width:calc(22px*var(--fs));height:calc(30px*var(--fs));border-bottom:2px solid var(--ink);font:600 calc(20px*var(--fs))/calc(30px*var(--fs)) var(--serif);text-align:center;border-radius:4px 4px 0 0}
.cc .n{font-size:calc(11px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.cc.p .l{border:0}
.cc.sel .l{background:var(--gold-soft)}
.cc.same .l{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.cc.given .l{color:var(--sage)}
.cc.bad .l{color:var(--red)}
.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}
.kb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;height:calc(46px*var(--fs));font:600 calc(16px*var(--fs)) var(--sans);padding:0;cursor:pointer}
.kb button.usedk{opacity:.4}
.kb .wide{grid-column:span 2}
/* word search */
.ws-grid{display:grid;gap:3px;touch-action:none;margin:0 auto}
.ws-grid div{aspect-ratio:1;display:grid;place-items:center;font:600 calc(18px*var(--fs)) var(--serif);border-radius:8px;background:var(--paper);text-transform:uppercase}
.ws-grid div.on{background:var(--gold-soft)}
.ws-grid div.found{background:var(--sage-soft);color:var(--sage)}
.ws-words{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:14px;font:calc(15px*var(--fs)) var(--serif)}
.ws-words .f{text-decoration:line-through;color:var(--muted)}
/* done */
.done{text-align:center;display:grid;gap:14px;padding-top:24px}
.done .seal{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--gold);color:#1b1408;display:grid;place-items:center;font:700 34px var(--serif)}
.done blockquote{margin:0;font:calc(21px*var(--fs))/1.5 var(--serif);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.done cite{display:block;margin-top:10px;font-style:normal;color:var(--gold);font-weight:600}
/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;border:0;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--sage)}.toggle[aria-pressed="true"]::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* juice */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.tile{transition:transform .08s}.tile:active{transform:scale(.94)}
.word.pop,.ws-grid div.found,.cc.pop .l{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.done .seal{animation:seal .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes seal{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.pill.glow{animation:glow 1.2s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(217,166,72,.7)}100%{box-shadow:0 0 0 18px rgba(217,166,72,0)}}
.coach{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.coach .in{background:var(--paper);max-width:560px;width:100%;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;gap:12px}
.coach h3{margin:0;font:600 calc(21px*var(--fs)) var(--serif)}
.coach .dots{display:flex;gap:6px;justify-content:center}.coach .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.coach .dots i.on{background:var(--gold)}
.coach .demo{font-size:42px;text-align:center}
@media (prefers-reduced-motion:reduce){.shake,.word.pop,.ws-grid div.found,.cc.pop .l,.done .seal,.pill.glow{animation:none}}
</style>
</head>

  crypto:{name:'Cryptogram',sub:'Crack the coded verse',ic:'?',bg:'var(--sage-soft)',fg:'var(--sage)'},
  search:{name:'Word Search',sub:'Find the words of the verse',ic:'#',bg:'#e7e9f3',fg:'var(--night)'}
};
function dailyPlan(){const n=dayNum();const kinds=['order','crypto','search'];const kind=kinds[n%3];const pool=POOL[kind];return{kind,verse:pool[(n*7919)%pool.length]}}

/* ---------- home ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function checkStreak(){ // runs on open: uses a freeze for one missed day, otherwise resets
  if(!S.last||S.streak===0)return; const y=ymd(new Date(Date.now()-864e5)), y2=ymd(new Date(Date.now()-2*864e5));
  if(S.last===today()||S.last===y)return;
  if(S.last===y2&&S.freezes>0){S.freezes--;S.last=y;save();setTimeout(()=>toast('Streak saved! A streak freeze covered yesterday.'),400);return}
  S.streak=0;save();
}
checkStreak();
function home(){
  const d=dailyPlan(), doneToday=S.dailyDone===today();
  const mode=k=>{const tot=POOL[k].length,lv=Math.min(S.lv[k],tot),m=MODES[k];return `<button class="mode" data-mode="${k}"><div class="ic" style="background:${m.bg};color:${m.fg}">${m.ic}</div><b>${m.name}</b><span>${m.sub}</span><div class="bar"><i style="width:${Math.max(3,lv/tot*100)}%"></i></div><span>Level ${lv+1} of ${tot}</span></button>`};
  app.innerHTML=`<header class="top"><h1>Verse Puzzle</h1><div style="display:flex;gap:8px"><span class="pill" title="Day streak · best ${S.best}">🔥 ${S.streak}${S.freezes?` · ❄︎${S.freezes}`:''}</span><button class="iconbtn" id="set" aria-label="Settings">⚙︎</button></div></header>
  <div class="daily"><div class="eyebrow">Daily verse · ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
  <h2>${doneToday?'You finished today’s verse':'Today’s '+MODES[d.kind].name.toLowerCase()}</h2>
  <p>${doneToday?esc(d.verse.r)+' · come back tomorrow to keep your streak':'One verse a day. Solve it to grow your streak.'}</p>
  <div><button class="btn gold" id="daily">${doneToday?'See today’s verse':'Play today’s verse'}</button></div></div>
  <div class="section-h">Puzzles</div>
  <div class="modes">${mode('order')}${mode('crypto')}${mode('search')}
   <button class="mode" id="hintsInfo"><div class="ic" style="background:var(--gold-soft);color:var(--gold)">✦</div><b>${S.hints} hints</b><span>Earn one every 3 puzzles you solve</span></button></div>
  <div class="foot">King James Version · works offline · ${S.solved} puzzles solved</div>`;
  $('#daily').onclick=()=>doneToday?showDone(d.verse,'daily',true):play(d.kind,d.verse,'daily');
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const k=b.dataset.mode;const pool=POOL[k];play(k,pool[Math.min(S.lv[k],pool.length-1)],'level')});
  $('#set').onclick=settings; $('#hintsInfo').onclick=()=>toast('Hints reveal a word or letter. You earn one every 3 puzzles.');
}
function head(kind,ctx,v){return `<div class="play-head"><button class="iconbtn" id="back" aria-label="Back">‹</button><div class="t"><b>${ctx==='daily'?'Daily verse':MODES[kind].name}</b><span>${ctx==='daily'?MODES[kind].name:'Level '+(S.lv[kind]+1)}</span></div><button class="iconbtn" id="hint">✦ ${S.hints}</button></div>`}
function useHint(){if(S.hints<=0){toast('No hints left. Solve 3 puzzles to earn one.');return false}S.hints--;save();const h=$('#hint');if(h)h.textContent='✦ '+S.hints;return true}
let puzzleId=0,solvedId=-1;
function play(kind,v,ctx){puzzleId++;({order:playOrder,crypto:playCrypto,search:playSearch})[kind](v,ctx)}
function solved(kind,v,ctx){
  if(solvedId===puzzleId)return; solvedId=puzzleId;
  buzz('ok'); S.solved++; if(S.solved%3===0){S.hints++;}
  if(ctx==='daily'&&S.dailyDone!==today()){const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');S.streak=S.last===ys?S.streak+1:1;S.last=today();S.dailyDone=today();S.best=Math.max(S.best,S.streak);if(S.streak%7===0&&S.freezes<2){S.freezes++;setTimeout(()=>toast('7-day streak! You earned a streak freeze ❄︎'),1600)}}
  if(ctx==='level'){if(S.lv[kind]>=POOL[kind].length-1)setTimeout(()=>toast('You finished every '+MODES[kind].name+' level!'),1600);S.lv[kind]=Math.min(S.lv[kind]+1,POOL[kind].length-1);}
  save(); sfx('win'); confetti(); setTimeout(()=>showDone(v,ctx,false,kind),650);
}
function showDone(v,ctx,review,kind){
  app.innerHTML=`<div class="done"><div class="seal">✓</div><div style="font:600 calc(22px*var(--fs)) var(--serif)">${review?'Today’s verse':ctx==='daily'?'Daily verse complete':'Well done'}</div>
  ${ctx==='daily'&&!review?`<div class="pill glow" style="justify-self:center">🔥 ${S.streak} day streak</div>`:''}
  <blockquote>${esc(v.t)}<cite>${esc(v.r)} KJV</cite></blockquote>
  <div class="toolbar">${ctx==='level'?`<button class="btn gold" id="next">Next puzzle</button>`:''}<button class="btn ghost" id="share">Share verse</button><button class="btn ghost" id="home">Home</button></div></div>`;
  $('#home').onclick=home; if($('#next'))$('#next').onclick=()=>{const pool=POOL[kind];play(kind,pool[S.lv[kind]],'level')};
  $('#share').onclick=async()=>{const text=ctx==='daily'?`Verse Puzzle · ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}\n🔥 ${S.streak} day streak ${'🟨'.repeat(Math.min(S.streak,7))}\n\n“${v.t}”\n${v.r} KJV`:`“${v.t}” ${v.r} KJV`;try{if(Share)await Share.share({text});else if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);toast('Verse copied')}}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(text);toast('Verse copied')}catch(_){toast('Sharing is not available here')}}};
}

/* ---------- verse builder ---------- */
function playOrder(v,ctx){
  const words=v.t.split(' '); const n=words.length;
  const pre=n>22?Math.floor(n*0.35):n>14?Math.floor(n*0.2):0; // longer verses start partly filled
  const fixed=new Set(shuffle([...Array(n).keys()],rng(v.t.length*31)).slice(0,pre));
  let pos=0; const placed=Array(n).fill(false); fixed.forEach(i=>placed[i]=true);
  const tiles=shuffle([...Array(n).keys()].filter(i=>!fixed.has(i)));
  const bare=w=>w.replace(/[^A-Za-z’']/g,'');const same=(a,b)=>bare(a)===bare(b);
  const advance=()=>{while(pos<n&&placed[pos])pos++;};
  app.innerHTML=head('order',ctx,v)+`<div class="ref">${esc(v.r)}</div><div class="board"><div class="slots" id="slots">${words.map((w,i)=>`<span class="${placed[i]?'word':'slot'}" data-i="${i}">${placed[i]?esc(w):''}</span>`).join('')}</div></div>
  <div class="tiles" id="tiles">${tiles.map(i=>`<button class="tile" data-i="${i}">${esc(words[i])}</button>`).join('')}</div>`;
  advance(); markNext();
  function markNext(){app.querySelectorAll('.slot').forEach(s=>s.style.borderBottomColor='');const s=app.querySelector(`.slot[data-i="${pos}"]`);if(s)s.style.borderBottomColor='var(--gold)';}
  $('#tiles').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const i=+t.dataset.i;
    if(pos<n&&same(words[i],words[pos])){ // same word, any punctuation, is interchangeable
      placed[pos]=true;const s=app.querySelector(`[data-i="${pos}"].slot`);s.className='word pop';s.textContent=words[pos];burstAt(s,6);t.classList.add('used');sfx('place');if(S.haptics)try{Haptics?Haptics.impact({style:'LIGHT'}):navigator.vibrate&&navigator.vibrate(10)}catch(e){};advance();markNext();
      if(pos>=n)solved('order',v,ctx);
    } else {t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');buzz('bad');}
  };
  $('#hint').onclick=()=>{if(pos>=n||!useHint())return;const t=[...app.querySelectorAll('.tile:not(.used)')].find(b=>same(words[+b.dataset.i],words[pos]));if(t)t.click();};
  $('#back').onclick=home;
}

/* ---------- cryptogram ---------- */
function playCrypto(v,ctx){
  const r=rng(v.t.length*97+v.r.length);
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const nums=shuffle([...Array(26).keys()].map(x=>x+1),r); const code={};A.forEach((c,i)=>code[c]=nums[i]);
  const txt=v.t.toUpperCase(); const letters=[...new Set(txt.replace(/[^A-Z]/g,''))];
  const freq={};for(const c of txt)if(/[A-Z]/.test(c))freq[c]=(freq[c]||0)+1;
  const giveN=Math.max(2,Math.round(letters.length*(txt.length>100?0.3:0.22)));
  const given=new Set(shuffle(letters,r).sort((a,b)=>freq[b]-freq[a]).slice(0,giveN));
  const guess={};given.forEach(c=>guess[c]=c);
  let sel=null;
  const cells=[];let idx=0;
  const wordsHtml=txt.split(' ').map(w=>`<span class="cw">${[...w].map(ch=>{if(/[A-Z]/.test(ch)){const i=idx++;cells.push(ch);return `<span class="cc${given.has(ch)?' given':''}" data-k="${i}" data-c="${ch}"><span class="l"></span><span class="n">${code[ch]}</span></span>`}return `<span class="cc p"><span class="l">${esc(ch)}</span><span class="n">&nbsp;</span></span>`}).join('')}</span>`).join('');
  app.innerHTML=head('crypto',ctx,v)+`<div class="ref">${esc(v.r)}</div><div class="board"><div class="crypto" id="cg">${wordsHtml}</div></div>
  <div class="kb" id="kb">${'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').map(c=>`<button data-l="${c}">${c}</button>`).join('')}<button class="wide" data-l="DEL">⌫</button></div>`;
  function render(){app.querySelectorAll('#cg .cc[data-c]').forEach(el=>{const c=el.dataset.c;el.querySelector('.l').textContent=guess[c]||'';el.classList.toggle('sel',sel!==null&&el.dataset.k==sel);el.classList.toggle('same',sel!==null&&cells[sel]===c&&el.dataset.k!=sel);el.classList.remove('bad')});
    const used=new Set(Object.values(guess));app.querySelectorAll('#kb [data-l]').forEach(b=>b.classList.toggle('usedk',used.has(b.dataset.l)));}
  function nextOpen(from){for(let k=1;k<=cells.length;k++){const j=(from+k)%cells.length;if(!guess[cells[j]])return j}return null}
  sel=nextOpen(-1); render();
  $('#cg').onclick=e=>{const el=e.target.closest('.cc[data-c]');if(!el||given.has(el.dataset.c))return;sel=+el.dataset.k;buzz();render();};
  $('#kb').onclick=e=>{const b=e.target.closest('[data-l]');if(!b||sel===null||solvedId===puzzleId)return;const c=cells[sel];const L=b.dataset.l;
    if(L!=='DEL'&&[...given].some(k=>k!==c&&guess[k]===L)){buzz('bad');toast(L+' is already used in green');return}
    if(L==='DEL'){delete guess[c];render();return}
    for(const k in guess)if(guess[k]===L&&!given.has(k))delete guess[k];
    guess[c]=L;buzz();
    const full=letters.every(x=>guess[x]);
    if(full){ render(); if(letters.every(x=>guess[x]===x)){solved('crypto',v,ctx);return}
      app.querySelectorAll('#cg .cc[data-c]').forEach(el=>{if(guess[el.dataset.c]!==el.dataset.c)el.classList.add('bad')});buzz('bad');toast('Almost. Letters in red are wrong.');return }
    const nx=nextOpen(sel);sel=nx===null?sel:nx;render();
  };
  $('#hint').onclick=()=>{const wrong=letters.filter(x=>guess[x]!==x);if(!wrong.length||!useHint())return;const c=sel!==null&&guess[cells[sel]]!==cells[sel]?cells[sel]:wrong[0];for(const k in guess)if(guess[k]===c&&k!==c)delete guess[k];guess[c]=c;given.add(c);app.querySelectorAll(`.cc[data-c="${c}"]`).forEach(el=>el.classList.add('given'));
    if(letters.every(x=>guess[x]===x)){render();solved('crypto',v,ctx);return}sel=nextOpen(sel??-1);render();};
  $('#back').onclick=home;
}

/* ---------- word search ---------- */
function playSearch(v,ctx){
  const r=rng(v.t.length*53+7);
  const N=S.large?8:9;
  let words=shuffle(longWords(v.t),r).filter(w=>w.length<=N).slice(0,S.large?5:7).sort((a,b)=>b.length-a.length);
  const dirs=[[0,1],[1,0],[1,1],[-1,1]];
  let grid,placedW;
  for(let attempt=0;attempt<40;attempt++){
    grid=Array.from({length:N},()=>Array(N).fill(''));placedW=[];
    for(const w of words){let ok=false;for(let t=0;t<200&&!ok;t++){const [dr,dc]=dirs[Math.floor(r()*dirs.length)];const r0=Math.floor(r()*N),c0=Math.floor(r()*N);const cellsW=[];
      for(let k=0;k<w.length;k++){const rr=r0+dr*k,cc=c0+dc*k;if(rr<0||cc<0||rr>=N||cc>=N||(grid[rr][cc]&&grid[rr][cc]!==w[k])){cellsW.length=0;break}cellsW.push([rr,cc])}
      if(cellsW.length===w.length){cellsW.forEach(([rr,cc],k)=>grid[rr][cc]=w[k]);placedW.push({w,cells:cellsW});ok=true}}
      if(!ok)break;}
    if(placedW.length===words.length)break;
  }
  words=placedW.map(p=>p.w);
  const AL='EEEAAIIOOTTNNSSRRHHLLDDUMWYFGCBPKV';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!grid[i][j])grid[i][j]=AL[Math.floor(r()*AL.length)];
  const found=new Set();
  app.innerHTML=head('search',ctx,v)+`<div class="ref">${esc(v.r)}</div><div class="board"><div class="ws-grid" id="g" style="grid-template-columns:repeat(${N},1fr);max-width:${Math.min(520,N*52)}px">${grid.flat().map((ch,k)=>`<div data-k="${k}">${ch}</div>`).join('')}</div>
  <div class="ws-words" id="wl">${words.map(w=>`<span data-w="${w}">${w[0]+w.slice(1).toLowerCase()}</span>`).join('')}</div></div>
  <p class="foot" style="margin-top:12px">Drag across a word, in any straight line.</p>`;
  const g=$('#g');let start=null,cur=[];
  const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===g?+el.dataset.k:null};
  const line=(a,b)=>{const r1=Math.floor(a/N),c1=a%N,r2=Math.floor(b/N),c2=b%N;const dr=Math.sign(r2-r1),dc=Math.sign(c2-c1);const len=Math.max(Math.abs(r2-r1),Math.abs(c2-c1));
    if(!(r1===r2||c1===c2||Math.abs(r2-r1)===Math.abs(c2-c1)))return[a];const out=[];for(let k=0;k<=len;k++)out.push((r1+dr*k)*N+(c1+dc*k));return out};
  const paint=()=>g.querySelectorAll('div').forEach(d=>d.classList.toggle('on',cur.includes(+d.dataset.k)));
  g.addEventListener('pointerdown',e=>{const k=cellAt(e);if(k===null)return;start=k;cur=[k];paint();g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(start===null)return;const k=cellAt(e);if(k===null)return;const nl=line(start,k);if(nl.join()!==cur.join()){cur=nl;paint();buzz()}});
  const end=()=>{if(start===null)return;const s=cur.map(k=>grid[Math.floor(k/N)][k%N]).join('');const rev=[...s].reverse().join('');
    const hit=placedW.find(p=>!found.has(p.w)&&(p.w===s||p.w===rev)&&p.cells.length===cur.length);
    if(hit){found.add(hit.w);hit.cells.forEach(([rr,cc])=>g.children[rr*N+cc].classList.add('found'));burstAt(g.children[hit.cells[Math.floor(hit.cells.length/2)][0]*N+hit.cells[Math.floor(hit.cells.length/2)][1]],14);$('#wl').querySelector(`[data-w="${hit.w}"]`).classList.add('f');buzz('ok');if(found.size===words.length)solved('search',v,ctx)}
    start=null;cur=[];paint()};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  $('#hint').onclick=()=>{const p=placedW.find(p=>!found.has(p.w));if(!p||!useHint())return;const [rr,cc]=p.cells[0];const el=g.children[rr*N+cc];el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600);};
  $('#back').onclick=home;
}

/* ---------- settings ---------- */
function settings(){
  const sh=document.createElement('div');sh.className='sheet';
  sh.innerHTML=`<div class="in"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font:600 20px var(--serif)">Settings</b><button class="iconbtn" id="x" aria-label="Close">✕</button></div>
  <div class="row"><span>Large text</span><button class="toggle" id="tLarge" aria-pressed="${S.large}" aria-label="Large text"></button></div>
  <div class="row"><span>Vibration</span><button class="toggle" id="tHap" aria-pressed="${S.haptics}" aria-label="Vibration"></button></div>
  <div class="row"><span>Sound effects</span><button class="toggle" id="tSnd" aria-pressed="${S.sound}" aria-label="Sound effects"></button></div>
  ${LN?`<div class="row"><span>Daily reminder (8am)</span><button class="toggle" id="tRem" aria-pressed="${S.remind}" aria-label="Daily reminder"></button></div>`:''}
  <div class="row"><span>How to play</span><button class="btn ghost" id="howto" style="min-height:36px;padding:8px 12px">Show</button></div>
  <div class="row" style="display:block;color:var(--muted);font-size:14px">Verse Puzzle uses the King James Version (public domain). Your progress stays on this device. No account, no tracking.</div></div>`;
  document.body.appendChild(sh);
  const close=()=>{sh.remove();home()};
  $('#x',sh).onclick=close;sh.onclick=e=>{if(e.target===sh)close()};
  $('#tLarge',sh).onclick=e=>{S.large=!S.large;save();e.target.setAttribute('aria-pressed',S.large);document.documentElement.style.setProperty('--fs',S.large?1.22:1)};
  $('#tHap',sh).onclick=e=>{S.haptics=!S.haptics;save();e.target.setAttribute('aria-pressed',S.haptics)};
  $('#tSnd',sh).onclick=e=>{S.sound=!S.sound;save();e.target.setAttribute('aria-pressed',S.sound);sfx('place')};
  if($('#tRem',sh))$('#tRem',sh).onclick=async e=>{if(!S.remind){const ok=await scheduleReminder();if(!ok){toast('Turn on notifications for Verse Puzzle in Settings');return}S.remind=true}else{await cancelReminder();S.remind=false}save();e.target.setAttribute('aria-pressed',S.remind)};
  $('#howto',sh).onclick=()=>{sh.remove();coach()};
}
function coach(){
  const steps=[['📖','One verse a day','Each day brings a new verse puzzle. Solve it to grow your 🔥 streak. Miss a day? A ❄︎ streak freeze saves it, and you earn one every 7 days.'],
    ['Aa','Three kinds of puzzles','Verse Builder: tap the words in order. Cryptogram: crack the number code. Word Search: drag across the hidden words.'],
    ['✦','Stuck? Use a hint','Hints reveal a word or letter. You start with 5 and earn one for every 3 puzzles you solve.']];
  let i=0;const el=document.createElement('div');el.className='coach';document.body.appendChild(el);
  const draw=()=>{const [ic,h,t]=steps[i];el.innerHTML=`<div class="in"><div class="demo">${ic}</div><h3>${h}</h3><p style="margin:0;color:var(--muted)">${t}</p><div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="btn gold" id="cn">${i<steps.length-1?'Next':'Start playing'}</button></div>`;
    $('#cn',el).onclick=()=>{sfx('tap');if(i<steps.length-1){i++;draw()}else{el.remove();S.coached=true;save();home()}}};
  draw();
}
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||today()===lastDay)return;lastDay=today();checkStreak();if(document.querySelector('header.top'))home();});
home(); if(!S.coached)coach();
})();
</script>
