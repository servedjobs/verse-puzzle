name: Android build
# Every push to main builds:
#   - verse-puzzle-test.apk  : install straight on an Android phone to try it
#   - verse-puzzle.aab       : the bundle Google Play wants (signed once the upload key secrets exist)
# Nothing is uploaded to Google Play from here.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx cap sync android

      - name: Test app (debug APK)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Load upload key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Play bundle (AAB)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Name the outputs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/verse-puzzle-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/verse-puzzle.aab
          if [ "$HAS_KEY" != "true" ]; then echo "UNSIGNED: add the upload key secrets before sending this bundle to Play." > out/README-UNSIGNED.txt; fi

      - uses: actions/upload-artifact@v4
        with:
          name: verse-puzzle-android-${{ github.run_number }}
          path: out/
