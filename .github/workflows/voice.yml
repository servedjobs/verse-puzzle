name: Make narration voices
on:
  push:
    branches: [prayerchair]
    paths: [".github/workflows/voice.yml", "voice/lines.json", "voice/make.py", "voice/people.json", "voice/make_people.py"]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "kokoro>=0.9" soundfile
      - run: SHARD=${{ matrix.shard }} NSHARD=6 python voice/make.py
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.shard }}", path: voice/out }
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "kokoro>=0.9" soundfile
      - run: python voice/make_people.py
      - uses: actions/upload-artifact@v4
        with: { name: "people", path: voice/pout }
  merge:
    needs: [voice, people]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/art }
      - run: |
          mkdir -p voice/out/v voice/pout
          cp -r /tmp/art/people/* voice/pout/
          python3 - <<'PY'
          import json,glob
          m={}
          import shutil,os
          for f in sorted(glob.glob('/tmp/art/shard-*/narr_*.json')):
              d=os.path.dirname(f); n=json.load(open(f)); m.update(n)
              for sid in n: shutil.copy(d+'/v/'+sid+'.mp3','voice/out/v/'+sid+'.mp3')
          json.dump(m,open('voice/out/narr.json','w'),ensure_ascii=False)
          print(len(m))
          PY
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add voice/out voice/pout && git commit -m "Narration voices [skip ci]" && git pull --rebase -q && git push
