name: Make narration voices
on:
  push:
    branches: [prayerchair]
    paths: [".github/workflows/voice.yml", "voice/lines.json", "voice/make.py"]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "kokoro>=0.9" soundfile
      - run: python voice/make.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add voice/out && git commit -m "Narration voices [skip ci]" && git pull --rebase -q && git push
