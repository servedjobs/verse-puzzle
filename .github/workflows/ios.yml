name: iPhone build (simulator)
# Manual only. Proves the iOS project compiles; no Apple account needed.
# TestFlight upload gets added once the Apple Developer account exists.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Bible keys (NIV, ESV, NLT)
        env:
          YV_APP_KEY: ${{ secrets.YV_APP_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
          NLT_API_KEY: ${{ secrets.NLT_API_KEY }}
          YV_BIBLE_IDS: ${{ vars.YV_BIBLE_IDS }}
        run: node -e 'const e=process.env;let ids={};try{ids=JSON.parse(e.YV_BIBLE_IDS||"{}")}catch(x){};require("fs").writeFileSync("www/keys.js","window.PC_KEYS="+JSON.stringify({yv:e.YV_APP_KEY||"",esv:e.ESV_API_KEY||"",nlt:e.NLT_API_KEY||"",yvIds:ids})+";")'
      - run: npx cap sync ios
      - name: Build for the iPhone simulator
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
