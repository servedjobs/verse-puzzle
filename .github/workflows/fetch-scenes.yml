name: Fetch Bible scene art
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scenes/fetch.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add www/scenes && git commit -m "Add Bible scene art (Doré, public domain) [skip ci]" && git push
